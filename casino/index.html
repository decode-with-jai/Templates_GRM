<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>SPIN | Premium Gaming</title>

    <meta name="description" content="Premium Gaming Platform">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            background: #050505;
            color: #fff;
            overflow-x: hidden;

        }

        :root {

            --gold: #ffc107;
            --green: #00ff88;
            --glass: rgba(255, 255, 255, .06);

        }

        /* Background */

        body::before {

            content: "";
            position: fixed;
            left: -300px;
            top: -300px;
            width: 700px;
            height: 700px;
            background: #ffb300;
            filter: blur(150px);
            opacity: .15;
            z-index: -2;

        }

        body::after {

            content: "";
            position: fixed;
            right: -300px;
            bottom: -300px;
            width: 700px;
            height: 700px;
            background: #00ff88;
            filter: blur(150px);
            opacity: .08;
            z-index: -2;

        }

        /* Navbar */

        nav {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(15px);
            z-index: 999;

        }

        .logo {

            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--gold);

        }

        nav ul {

            display: flex;
            gap: 35px;
            list-style: none;

        }

        nav a {

            text-decoration: none;
            color: #fff;
            transition: .3s;

        }

        nav a:hover {

            color: var(--gold);

        }

        .cta {

            padding: 14px 28px;
            background: linear-gradient(135deg, #ffc107, #ffeb3b);
            border-radius: 40px;
            font-weight: 700;
            color: #000;
            cursor: pointer;

        }

        /* Hero */

        .hero {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            padding: 100px 8%;

        }

        .hero h1 {

            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;

        }

        .hero h1 span {

            color: var(--gold);

        }

        .hero p {

            margin: 30px auto;
            max-width: 800px;
            font-size: 20px;
            line-height: 1.8;
            color: #ddd;

        }

        .play-btn {

            display: inline-block;
            padding: 22px 55px;
            background: linear-gradient(135deg, #00ff88, #00d26f);
            color: #000;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 700;
            margin-top: 20px;

        }

        /* Stats */

        .stats {

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 80px 8%;

        }

        .card {

            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            backdrop-filter: blur(15px);

        }

        .card h2 {

            font-size: 50px;
            color: var(--gold);

        }

        .card p {

            margin-top: 10px;
            color: #ccc;

        }

        /* Responsive */

        @media(max-width:900px) {

            .hero h1 {

                font-size: 50px;

            }

            .stats {

                grid-template-columns: repeat(2, 1fr);

            }

        }

        @media(max-width:600px) {

            nav ul {

                display: none;

            }

            .hero h1 {

                font-size: 38px;

            }

            .hero p {

                font-size: 16px;

            }

            .stats {

                grid-template-columns: 1fr;

            }

            .play-btn {

                width: 100%;

            }

        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">SPIN</div>

        <ul>

            <li><a href="#">Home</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Bonus</a></li>
            <li><a href="#">Support</a></li>

        </ul>

        <div class="cta">Play Now</div>

    </nav>

    <section class="hero">

        <div>

            <h1>

                Premium <span>Gaming</span>

                Experience

            </h1>

            <p>

                Play hundreds of exciting games with a fast, modern interface built for mobile, tablet, and desktop.

            </p>

            <a class="play-btn">START NOW</a>

        </div>

    </section>

    <section class="stats">

        <div class="card">

            <h2>500+</h2>

            <p>Games</p>

        </div>

        <div class="card">

            <h2>2M+</h2>

            <p>Players</p>

        </div>

        <div class="card">

            <h2>24/7</h2>

            <p>Support</p>

        </div>

        <div class="card">

            <h2>99%</h2>

            <p>Fast Access</p>

        </div>

    </section>
