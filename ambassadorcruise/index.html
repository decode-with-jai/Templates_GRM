  <style>
    :root {
      --accent: #ef5a2f;
      --dark: #122224;
      --cream: #fffaf3;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       FULL-SCREEN HERO
       ========================= */
    .hero-link {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: #111;
    }

    .hero-picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: center center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Optional tiny hint; remove display:flex if you do not need it */
    .tap-hint {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .7px;
      pointer-events: none;
    }


    /* =========================
       MOBILE + TABLET NAVBAR/TITLE
       ========================= */
    .mobile-tablet-navbar,
    .mobile-tablet-title {
      display: none;
    }

    @media (max-width: 1024px) {
      .mobile-tablet-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 74px;
        padding: 12px clamp(16px, 4vw, 34px);
        background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.14), transparent);
        color: #fff;
      }

      .mobile-tablet-navbar a {
        color: inherit;
        text-decoration: none;
      }

      .mobile-brand {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 0 0 auto;
        line-height: 1;
        text-shadow: 0 2px 14px rgba(0,0,0,.55);
      }

      .brand-main {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(17px, 2.8vw, 25px);
        letter-spacing: 2.6px;
      }

      .brand-sub {
        margin-top: 5px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 5px;
      }

      .mobile-nav-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(10px, 2.4vw, 24px);
        font-size: clamp(10px, 1.8vw, 14px);
        font-weight: 700;
        letter-spacing: .8px;
        text-transform: uppercase;
      }

      .mobile-nav-links > a:not(.mobile-book-btn) {
        padding: 12px 0;
        text-shadow: 0 2px 12px rgba(0,0,0,.65);
      }

      .mobile-book-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 9px clamp(12px, 2.4vw, 22px);
        border: 1px solid rgba(255,255,255,.85);
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        white-space: nowrap;
      }

      .mobile-tablet-title {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 10;
        display: block;
        width: min(92vw, 760px);
        color: #fff;
        text-align: center;
        transform: translate(-50%, -50%);
        text-shadow: 0 4px 24px rgba(0,0,0,.72);
        pointer-events: none;
      }

      .mobile-tablet-title p {
        margin-bottom: 7px;
        font-size: clamp(12px, 2.8vw, 20px);
        font-weight: 500;
        letter-spacing: clamp(2px, .7vw, 6px);
      }

      .mobile-tablet-title h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(50px, 11vw, 105px);
        font-weight: 400;
        line-height: .92;
        letter-spacing: clamp(3px, 1vw, 10px);
      }
    }

    @media (max-width: 640px) {
      .mobile-tablet-navbar {
        min-height: 66px;
        padding: 10px 14px;
      }

      .mobile-nav-links > a:not(.mobile-book-btn) {
        display: none;
      }

      .mobile-book-btn {
        min-height: 36px;
        padding: 8px 14px;
        font-size: 10px;
      }

      .brand-main {
        font-size: 16px;
        letter-spacing: 1.8px;
      }

      .brand-sub {
        font-size: 7px;
        letter-spacing: 4px;
      }

      .mobile-tablet-title {
        top: 51%;
      }
    }

    /* =========================
       POPUP + BLURRED BACKGROUND
       ========================= */
    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      background: rgba(8, 13, 13, .50);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity .35s ease, visibility .35s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .offer-card {
      position: relative;
      width: min(920px, 96vw);
      max-height: min(700px, 92vh);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 26px;
      background: var(--cream);
      box-shadow: 0 30px 90px rgba(0,0,0,.42);
      cursor: pointer;
      transform: translateY(20px) scale(.97);
      transition: transform .4s cubic-bezier(.2,.8,.2,1);
    }

    .popup-overlay.show .offer-card {
      transform: translateY(0) scale(1);
    }

    .offer-media {
      min-height: 500px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .offer-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.36)),
        linear-gradient(90deg, transparent 65%, rgba(255,250,243,.13));
    }

    .media-label {
      position: absolute;
      left: 22px;
      bottom: 22px;
      z-index: 2;
      max-width: 78%;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3vw, 40px);
      line-height: 1.02;
      text-shadow: 0 4px 18px rgba(0,0,0,.55);
    }

    .offer-content {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 5vw, 58px);
      color: var(--dark);
      background:
        radial-gradient(circle at top right, rgba(239,90,47,.11), transparent 35%),
        var(--cream);
    }

    .eyebrow {
      margin-bottom: 15px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2.1px;
      text-transform: uppercase;
    }

    .offer-title {
      margin-bottom: 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 5vw, 68px);
      line-height: .95;
      font-weight: 500;
    }

    .offer-copy {
      margin-bottom: 25px;
      color: #485253;
      font-size: 15px;
      line-height: 1.65;
    }

    .price-row {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 24px;
    }

    .old-price {
      color: #8b9292;
      font-size: 17px;
      text-decoration: line-through;
    }

    .new-price {
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1;
    }

    .price-unit {
      padding-bottom: 7px;
      color: #485253;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 12px 30px rgba(239,90,47,.30);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .fine-print {
      margin-top: 13px;
      color: #7b8383;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(13,25,26,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .close-btn:hover {
      transform: rotate(90deg);
      background: rgba(13,25,26,.94);
    }


    /* Mobile + tablet hero image */
    @media (max-width: 1024px) {
      .hero-image {
        object-fit: cover;
        object-position: center center;
      }
    }

    /* =========================
       TABLET
       ========================= */
    @media (max-width: 900px) {
      .offer-card {
        width: min(700px, 95vw);
        grid-template-columns: 1fr;
        grid-template-rows: minmax(235px, 38vh) auto;
        overflow-y: auto;
      }

      .offer-media {
        min-height: 0;
      }

      .offer-content {
        padding: 28px;
      }

      .media-label {
        font-size: clamp(25px, 6vw, 42px);
      }
    }

    /* =========================
       MOBILE
       ========================= */
    @media (max-width: 560px) {
      .hero-image {
        object-fit: cover;
        object-position: center center;
      }

      .tap-hint {
        right: 10px;
        bottom: 10px;
        padding: 8px 11px;
        font-size: 10px;
      }

      .popup-overlay {
        padding: 10px;
      }

      .offer-card {
        width: 100%;
        max-height: 94vh;
        border-radius: 20px;
        grid-template-rows: minmax(210px, 34vh) auto;
      }

      .offer-content {
        padding: 24px 22px 22px;
      }

      .offer-title {
        font-size: clamp(34px, 12vw, 50px);
      }

      .offer-copy {
        margin-bottom: 18px;
        font-size: 13px;
        line-height: 1.5;
      }

      .price-row {
        margin-bottom: 18px;
      }

      .media-label {
        left: 18px;
        bottom: 17px;
        max-width: 80%;
      }

      .close-btn {
        top: 10px;
        right: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>

    const heroLink = document.getElementById("heroLink");
    const popupOverlay = document.getElementById("popupOverlay");
    const offerCard = document.getElementById("offerCard");
    const closePopup = document.getElementById("closePopup");
    const offerMedia = document.getElementById("offerMedia");

    heroLink.href = HERO_REDIRECT_URL;
    heroLink.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.assign(HERO_REDIRECT_URL);
    });

    // Navbar links remain independently clickable above the full-page hero.
    document.querySelectorAll(".mobile-tablet-navbar a").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.stopPropagation();
      });
    });

    // Random offer on every refresh.
    const selectedOffer = offers[Math.floor(Math.random() * offers.length)];

    document.getElementById("eyebrow").textContent = selectedOffer.eyebrow;
    document.getElementById("offerTitle").textContent = selectedOffer.title;
    document.getElementById("offerCopy").textContent = selectedOffer.copy;
    document.getElementById("oldPrice").textContent = selectedOffer.oldPrice;
    document.getElementById("newPrice").textContent = selectedOffer.newPrice;
    document.getElementById("priceUnit").textContent = selectedOffer.unit;
    document.getElementById("ctaText").textContent = selectedOffer.cta;
    document.getElementById("mediaLabel").textContent = selectedOffer.label;
    offerMedia.style.backgroundImage = `url("${selectedOffer.image}")`;

    const popupTarget = selectedOffer.link || POPUP_DEFAULT_REDIRECT_URL;

    // Show popup after 3 seconds.
    const popupTimer = window.setTimeout(() => {
      popupOverlay.classList.add("show");
      offerCard.focus();
    }, 3000);

    // Entire popup card redirects.
    function openPopupLink() {
      window.location.assign(popupTarget);
    }

    offerCard.addEventListener("click", (event) => {
      if (event.target.closest("#closePopup")) return;
      event.stopPropagation();
      openPopupLink();
    });

    offerCard.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openPopupLink();
      }
    });

    // Close without redirecting.
    closePopup.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      popupOverlay.classList.remove("show");
    });

    // Escape key closes popup.
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        popupOverlay.classList.remove("show");
      }
    });

    // The complete popup area, including the blurred background, redirects.
    // Only the close button closes the popup without redirecting.
    popupOverlay.addEventListener("click", (event) => {
      if (event.target.closest("#closePopup")) return;
      window.location.assign(popupTarget);
    });

    // Prevent image dragging.
    document.addEventListener("dragstart", (event) => event.preventDefault());
  </script>
